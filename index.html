<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelTech | 3D Experiences</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <canvas class="webgl"></canvas>

    <div class="sound-on">SOUND ON 🔉</div>

    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="#home">TravelTech</a>
            </div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#destinations">Destinations</a></li>
                <li><a href="#experience">Experience</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home" class="hero section">
            <div class="content">
                <h1 class="hero-title">Way beyond next level…</h1>
                <p class="hero-subtitle">Don't stay grounded!! Elevate your journey.</p>
                <div class="scroll-indicator">Scroll to begin</div>
            </div>
        </section>

        <section id="destinations" class="section">
            <div class="content">
                <h2>Experiences like no other 🔥</h2>
                <p>There's travel… and then there's ours.</p>
            </div>
        </section>

        <section id="experience" class="section">
            <div class="content">
                <h2>Your destination for 3D worlds</h2>
                <p>Invest in your memories.</p>
            </div>
        </section>
    </main>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <!-- Custom Script -->
    <script src="script.js"></script>
</body>
</html>
