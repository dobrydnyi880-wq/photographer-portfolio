<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelTech - AI Sandbox</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">

    <div id="toast-container" class="fixed top-5 right-5 z-50"></div>

    <nav class="p-6 flex justify-between items-center backdrop-filter backdrop-blur-lg bg-white bg-opacity-5 border-b border-white border-opacity-10 shadow-lg sticky top-0 z-40">
        <h1 class="text-3xl font-bold tracking-wider text-green-400">TravelTech</h1>
        <div class="space-x-4">
            <button onclick="switchMode('SOLO')" class="px-5 py-2 rounded-full border border-green-400 text-green-400 hover:bg-green-400 hover:text-gray-900 transition-all duration-300">SOLO</button>
            <button onclick="switchMode('FAMILY')" class="px-5 py-2 rounded-full border border-pink-400 text-pink-400 hover:bg-pink-400 hover:text-gray-900 transition-all duration-300">FAMILY</button>
            <button onclick="switchMode('ORGANIZER')" class="px-5 py-2 rounded-full border border-yellow-400 text-yellow-400 hover:bg-yellow-400 hover:text-gray-900 transition-all duration-300">ORGANIZER</button>
        </div>
    </nav>

    <main class="p-8 max-w-7xl mx-auto" id="dashboard-content">
        <!-- Content will be dynamically populated here by script.js -->
        <div class="text-center mt-20 text-gray-400 text-xl animate-pulse">Loading TravelTech Sandbox...</div>
    </main>

    <script src="/script.js"></script>
</body>
</html>
